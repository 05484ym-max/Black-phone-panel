<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>המכירות שלי</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1B2340" />
<link rel="icon" href="icon-192-2.png" />
<link rel="apple-touch-icon" href="icon-192-2.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="מכירות" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600;700&family=Assistant:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  #app { width: 100%; }

  .app-outer {
    --ink: #F3F6FC;
    --surface: #FFFFFF;
    --surface-2: #ECF1F9;
    --surface-3: #D7DFEC;
    --gold: #9C7A2E;
    --gold-dim: rgba(156,122,46,0.14);
    --gold-deep: #7A5D1F;
    --platinum: #4E5D80;
    --platinum-dim: rgba(78,93,128,0.12);
    --text-hi: #1B2340;
    --text-lo: #626C88;
    --danger: #B13F49;
    --danger-dim: rgba(177,63,73,0.10);
    --border: rgba(27,35,64,0.10);
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #E8F0FB 0%, #C7D8EE 70%);
    font-family: 'Assistant', sans-serif;
    font-weight: 500;
    padding: 18px 10px;
  }
  .phone-frame {
    position: relative;
    width: 100%;
    max-width: 400px;
    height: 840px;
    height: min(840px, 92vh);
    height: min(840px, 92dvh);
    background: linear-gradient(160deg, #262c42, #0a0b12);
    border-radius: 46px;
    padding: 12px;
    box-shadow: 0 40px 90px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.05);
  }

  .side-btn { position: absolute; background: #1c2032; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04); }
  .side-btn.power { right: -3px; top: 130px; width: 3px; height: 60px; border-radius: 0 3px 3px 0; }
  .side-btn.vol-up { left: -3px; top: 110px; width: 3px; height: 38px; border-radius: 3px 0 0 3px; }
  .side-btn.vol-down { left: -3px; top: 156px; width: 3px; height: 38px; border-radius: 3px 0 0 3px; }
  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--ink);
    border-radius: 34px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: var(--text-hi);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .phone-notch {
    position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%);
    width: 76px; height: 20px;
    background: #05060a;
    border-radius: 14px;
    z-index: 30;
    display: flex; align-items: center; justify-content: center;
  }
  .phone-notch span { width: 5px; height: 5px; border-radius: 50%; background: #23283b; }

  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 22px 2px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-lo);
  }
  .statusbar-icons { display: flex; align-items: center; gap: 5px; color: var(--text-lo); }

  .app-header { padding: 6px 20px 14px 20px; }
  .app-header-top { display: flex; align-items: center; justify-content: space-between; }
  .app-title { display: flex; align-items: center; gap: 8px; }
  .app-title h1 { font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: 18px; margin: 0; letter-spacing: 0.2px; }
  .app-title-icon {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--gold-dim);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold);
  }
  .refresh-btn {
    background: transparent; border: none; color: var(--text-lo);
    width: 30px; height: 30px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .refresh-btn:hover { background: var(--surface); color: var(--text-hi); }
  .refresh-btn:focus-visible { outline: 2px solid var(--gold); }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .app-subtitle { font-size: 12px; color: var(--text-lo); margin-top: 2px; }
  .live-clock { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
  .month-total-row {
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .month-total-label { font-size: 12px; color: var(--text-lo); letter-spacing: 0.2px; line-height: 1; }
  .month-total-value { font-family: 'Assistant', sans-serif; font-weight: 700; font-size: 26px; color: var(--gold); letter-spacing: 0.2px; line-height: 1; }

  .tab-content { flex: 1; overflow-y: auto; padding: 0 20px 16px 20px; -webkit-overflow-scrolling: touch; }
  .tab-content::-webkit-scrollbar { width: 0; }

  .section-label { font-size: 12px; color: var(--text-lo); margin: 18px 0 8px 0; font-weight: 500; }
  .section-label:first-child { margin-top: 4px; }

  .stat-row { display: flex; gap: 10px; }
  .statcard {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 4px;
    position: relative;
  }
  .statcard-label { font-size: 11px; color: var(--text-lo); letter-spacing: 0.15px; line-height: 1.3; }
  .statcard-value { font-size: 28px; line-height: 1.25; margin-top: 2px; }
  .statcard-sub { font-size: 10.5px; color: var(--text-lo); }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    margin-top: 14px;
  }
  .field { margin-bottom: 12px; }
  .field:last-of-type { margin-bottom: 0; }
  .field label { display: block; font-size: 11.5px; color: var(--text-lo); margin-bottom: 5px; }
  .field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 10px 12px;
    color: var(--text-hi);
    font-size: 14px;
    font-family: 'Assistant', sans-serif;
    outline: none;
  }
  .field input:focus-visible { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .form-error { color: var(--danger); font-size: 12px; margin-top: 4px; }
  .add-btn {
    width: 100%;
    margin-top: 14px;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    color: #221a08;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-family: 'Assistant', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer;
  }
  .add-btn:focus-visible { outline: 2px solid var(--text-hi); outline-offset: 2px; }
  .add-btn:active { transform: scale(0.98); }
  .add-btn:disabled { opacity: 0.6; cursor: default; }

  .sale-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .sale-row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .sale-row-product { font-size: 13.5px; font-weight: 600; color: var(--text-hi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sale-row-meta { font-size: 11px; color: var(--text-lo); font-family: 'Assistant', sans-serif; font-weight: 500; }
  .sale-row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .sale-row-sum { font-family: 'Assistant', sans-serif; font-weight: 700; color: var(--gold); font-size: 13.5px; }
  .icon-btn {
    background: transparent; border: none; color: var(--text-lo);
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:hover { color: var(--danger); background: var(--danger-dim); }
  .icon-btn:focus-visible { outline: 2px solid var(--gold); }

  .empty-state { text-align: center; padding: 34px 10px; color: var(--text-lo); }
  .empty-state .icon { color: var(--text-lo); opacity: 0.45; margin-bottom: 10px; }
  .empty-state p { font-size: 13px; margin: 0; }

  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .month-nav-label { font-family: 'Frank Ruhl Libre', serif; font-weight: 600; font-size: 16px; letter-spacing: 0.2px; }
  .month-nav button {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-hi);
    width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .month-nav button:hover { background: var(--surface-2); }
  .month-nav button:focus-visible { outline: 2px solid var(--gold); }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 12px; }
  .cal-weekday { text-align: center; font-size: 10.5px; color: var(--text-lo); padding-bottom: 4px; }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
    gap: 1px;
    padding: 2px;
  }
  .cal-cell.blank { visibility: hidden; cursor: default; }
  .cal-cell.is-today { box-shadow: inset 0 0 0 1.5px var(--gold); }
  .cal-cell.is-selected-cell { box-shadow: inset 0 0 0 1.5px var(--platinum); }
  .cal-cell.is-today.is-selected-cell { box-shadow: inset 0 0 0 1.5px var(--gold), inset 0 0 0 3px var(--platinum); }
  .cal-cell-num { font-size: 12px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--text-hi); }
  .cal-cell-amt { font-size: 8px; font-family: 'Assistant', sans-serif; font-weight: 700; color: var(--gold); }
  .cal-cell:focus-visible { outline: 2px solid var(--gold); }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 4px 4px 4px;
    margin-top: 6px;
  }
  .signalbars-track {
    display: flex; align-items: flex-end; gap: 4px;
    overflow-x: auto; padding: 0 4px 4px 4px;
  }
  .signalbars-track::-webkit-scrollbar { height: 0; }
  .signalbar {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 5px;
    background: transparent; border: none; cursor: pointer;
    min-width: 24px; height: 144px; padding: 0;
  }
  .signalbar.monthbar { min-width: 34px; }
  .signalbar-amt {
    font-family: 'Assistant', sans-serif; font-weight: 700; font-size: 9.5px;
    color: var(--gold); white-space: nowrap; margin-bottom: 1px;
  }
  .signalbar-fill {
    width: 10px; border-radius: 4px 4px 2px 2px;
    background: linear-gradient(180deg, var(--gold), var(--gold-deep));
  }
  .signalbar.is-today .signalbar-fill { background: linear-gradient(180deg, var(--platinum), #6b7690); }
  .signalbar.is-selected .signalbar-fill { box-shadow: 0 0 0 2px var(--text-hi); }
  .signalbar-day { font-size: 8.5px; color: var(--text-lo); font-family: 'JetBrains Mono', monospace; }

  .product-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .product-row:last-child { border-bottom: none; }
  .product-rank { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-lo); width: 16px; }
  .product-info { flex: 1; min-width: 0; }
  .product-name { font-size: 13.5px; font-weight: 600; color: var(--text-hi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .product-bar-bg { height: 4px; background: var(--surface-2); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .product-bar-fill { height: 100%; background: var(--platinum); border-radius: 2px; }
  .product-stats { text-align: left; flex-shrink: 0; }
  .product-qty { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--text-hi); }
  .product-rev { font-family: 'Assistant', sans-serif; font-weight: 600; font-size: 10.5px; color: var(--gold); }

  .bottom-nav {
    display: flex; border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px)) 14px;
  }
  .nav-btn {
    flex: 1; background: transparent; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 0; border-radius: 12px;
    color: var(--text-lo);
  }
  .nav-btn.active { color: var(--gold); }
  .nav-btn span { font-size: 10px; }
  .nav-btn:focus-visible { outline: 2px solid var(--gold); }
  .home-indicator { width: 100px; height: 4px; background: var(--surface-3); border-radius: 3px; margin: 6px auto 4px auto; }

  .icon { display: inline-flex; align-items: center; justify-content: center; }
  .icon svg { width: 100%; height: 100%; display: block; }

  .toast {
    position: absolute; bottom: 82px; left: 50%; transform: translateX(-50%);
    background: #1B2340; color: #F3F6FC;
    padding: 9px 16px; border-radius: 11px; font-size: 12px;
    border: 1px solid rgba(255,255,255,0.08); z-index: 60;
    box-shadow: 0 14px 30px rgba(0,0,0,0.25);
    max-width: 85%; text-align: center;
  }

  .setup-screen { flex: 1; padding: 26px 24px; text-align: center; color: var(--text-lo); overflow-y: auto; }
  .setup-screen .icon { color: var(--gold); margin-bottom: 12px; }
  .setup-screen h2 { font-family: 'Frank Ruhl Libre', serif; color: var(--text-hi); font-size: 16px; margin: 0 0 10px; }
  .setup-screen p { font-size: 13px; line-height: 1.7; margin: 0 0 8px; }
  .setup-screen code {
    display: block; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; color: var(--gold); margin-top: 12px; word-break: break-all;
    direction: ltr; text-align: left;
  }

  .lock-screen {
    flex: 1; padding: 30px 26px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .lock-icon {
    width: 56px; height: 56px; border-radius: 16px;
    background: var(--gold-dim); color: var(--gold);
    display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
  }
  .lock-screen h2 { font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: 18px; color: var(--text-hi); margin: 0 0 6px; }
  .lock-screen p { font-size: 12.5px; color: var(--text-lo); margin: 0 0 20px; }
  .lock-input {
    width: 100%; max-width: 240px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; text-align: center; font-size: 20px; letter-spacing: 4px;
    color: var(--text-hi); font-family: 'JetBrains Mono', monospace;
    outline: none;
  }
  .lock-input:focus-visible { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
  .lock-error { color: var(--danger); font-size: 12px; margin-top: 10px; }
  .lock-btn { width: 100%; max-width: 240px; margin-top: 14px; }

  .load-error {
    color: var(--danger); font-size: 12px; text-align: center; padding: 10px 12px;
    background: var(--danger-dim); border: 1px solid rgba(177,63,73,0.25);
    border-radius: 12px; margin-bottom: 12px;
  }
  .load-error p { margin: 0 0 6px; }
  .error-detail-toggle {
    background: none; border: none; color: var(--danger); text-decoration: underline;
    font-size: 11px; cursor: pointer; padding: 2px;
  }
  .error-detail-code {
    display: block; margin-top: 8px; background: rgba(0,0,0,0.04);
    border-radius: 8px; padding: 8px; font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-hi); direction: ltr; text-align: left;
    word-break: break-all; white-space: pre-wrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .add-btn, .icon-btn, .cal-cell, .nav-btn, .refresh-btn { transition: none !important; }
    .refresh-btn.spinning svg { animation: none !important; }
  }

  /* On real phone screens, drop the decorative mockup entirely so the
     app itself fills the whole viewport edge to edge. Placed last so it
     wins the cascade over the earlier same-specificity rules above. */
  @media (max-width: 600px) {
    .app-outer { padding: 0; background: var(--ink); min-height: 100vh; min-height: 100dvh; }
    .phone-frame {
      max-width: none; width: 100%;
      height: 100vh; height: 100dvh;
      border-radius: 0; padding: 0; box-shadow: none;
      background: transparent;
    }
    .side-btn, .phone-notch, .statusbar { display: none; }
    .phone-screen { border-radius: 0; box-shadow: none; }
    .app-header { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
    .bottom-nav { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
    .home-indicator { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.19.3';
import { useState, useEffect, useMemo, useCallback, useRef } from 'https://esm.sh/preact@10.19.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';

const html = htm.bind(h);

/* ============================================================
   CONFIG — after you deploy the Apps Script, paste the Web App
   URL below (it ends in /exec).
   ============================================================ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxa03zbLC57bBNGJ3QuVfcG88wh2KbCTBfi_ZQMW8jKFxjL0O7bgnZB9qk8BGiFSucP-w/exec';

// Access code required to open the app. This is a simple deterrent (visible

const MONTH_SHORT = ['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'];
const WEEKDAYS = ['א','ב','ג','ד','ה','ו','ש'];

const ICONS = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>',

  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  chevronRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',

function Icon({ name, size = 18 }) {
  return html`<span class="icon" style=${`width:${size}px;height:${size}px`} dangerouslySetInnerHTML=${{ __html: ICONS[name] || '' }}></span>`;
}

function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function formatILS(n) {
  return '₪' + Math.round(n).toLocaleString('he-IL');
}
function dayOfMonth(iso) {
  return parseInt(String(iso).slice(8, 10), 10);
}
function summarizeProducts(salesArr) {
  const map = {};
  salesArr.forEach(s => {
    if (!map[s.product]) map[s.product] = { qty: 0, revenue: 0 };
    map[s.product].qty += s.qty;
    map[s.product].revenue += s.price * s.qty;
  });
  return Object.entries(map).sort((a, b) => b[1].qty - a[1].qty);
}

/* ---------- local cache (instant load, refreshed in background) ---------- */

const CACHE_KEY = 'salesCacheV1';

function loadCachedSales() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveCachedSales(data) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
  } catch (e) {
    // storage unavailable/full — safe to ignore, just means no instant-load next time
  }
}

/* ---------- Apps Script data layer ---------- */

async function fetchSalesFromSheet() {
  let res;
  try {
    res = await fetch(APPS_SCRIPT_URL, { method: 'GET' });
  } catch (networkErr) {
    throw new Error('רשת: ' + networkErr.message);
  }
  const text = await res.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (parseErr) {
    throw new Error(`תגובה לא תקינה (HTTP ${res.status}): ${text.slice(0, 200)}`);
  }
  if (!data.ok) throw new Error('שגיאת שרת: ' + (data.error || 'שגיאה בטעינת הנתונים'));
  return data.sales || [];
}

async function postToSheet(payload) {
  let res;
  try {
    res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
      body: JSON.stringify(payload)
    });
  } catch (networkErr) {
    throw new Error('רשת: ' + networkErr.message);
  }
  const text = await res.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (parseErr) {
    throw new Error(`תגובה לא תקינה (HTTP ${res.status}): ${text.slice(0, 200)}`);
  }
  if (!data.ok) throw new Error('שגיאת שרת: ' + (data.error || 'שגיאה בשמירה'));
  return data;
}

/* ---------- small presentational pieces ---------- */

function StatCard({ label, value, accent, sub, currency }) {
  const fontStyle = currency
    ? `font-family:'Assistant',sans-serif;font-weight:700;`
    : `font-family:'Playfair Display',serif;font-weight:800;`;
  return html`
    <div class="statcard">
      <span class="statcard-label">${label}</span>
      <span class="statcard-value" style=${`color:${accent || 'var(--text-hi)'};${fontStyle}`}>${value}</span>
      ${sub ? html`<span class="statcard-sub">${sub}</span>` : null}
    </div>
  `;
}

function StatusBar() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(t);
  }, []);
  const time = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false });
  return html`
    <div class="statusbar">
      <span>${time}</span>
      <div class="statusbar-icons">
        <${Icon} name="signal" size=${13} />
        <${Icon} name="wifi" size=${13} />
        <${Icon} name="batteryFull" size=${15} />
      </div>
    </div>
  `;
}

function SignalBars({ dayTotals, daysInMonth, maxTotal, onPick, todayDay, selected }) {
  const bars = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const val = dayTotals[d] || 0;
    const ratio = maxTotal > 0 ? val / maxTotal : 0;
    const h = val > 0 ? 10 + ratio * 96 : 4;
    bars.push(html`
      <button
        key=${d}
        class=${`signalbar ${d === todayDay ? 'is-today' : ''} ${d === selected ? 'is-selected' : ''}`}
        onClick=${() => onPick(d)}
        aria-label=${`יום ${d}, ${formatILS(val)}`}
      >
        ${val > 0 ? html`<span class="signalbar-amt">${formatILS(val)}</span>` : null}
        <span class="signalbar-fill" style=${`height:${h}px;opacity:${val > 0 ? 0.55 + ratio * 0.45 : 0.25}`}></span>
        <span class="signalbar-day">${d}</span>
      </button>
    `);
  }
  return html`<div class="signalbars-track">${bars}</div>`;
}

function LiveClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  const time = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  return html`<span class="live-clock">${time}</span>`;
}

function MonthBars({ monthTotals, maxTotal, onPick, selectedMonth, currentMonth }) {
  const bars = [];
  for (let m = 0; m < 12; m++) {
    const val = monthTotals[m] || 0;
    const ratio = maxTotal > 0 ? val / maxTotal : 0;
    const h = val > 0 ? 10 + ratio * 96 : 4;
    bars.push(html`
      <button
        key=${m}
        class=${`signalbar monthbar ${m === currentMonth ? 'is-today' : ''} ${m === selectedMonth ? 'is-selected' : ''}`}
        onClick=${() => onPick(m)}
        aria-label=${`${MONTH_NAMES[m]}, ${formatILS(val)}`}
      >
        ${val > 0 ? html`<span class="signalbar-amt">${formatILS(val)}</span>` : null}
        <span class="signalbar-fill" style=${`height:${h}px;opacity:${val > 0 ? 0.55 + ratio * 0.45 : 0.25}`}></span>
        <span class="signalbar-day">${MONTH_SHORT[m]}</span>
      </button>
    `);
  }
  return html`<div class="signalbars-track">${bars}</div>`;
}

                <div class="month-nav">
                  <button onClick=${goPrevMonth} aria-label="חודש קודם"><${Icon} name="chevronRight" size=${17} /></button>
                  <span class="month-nav-label">${MONTH_NAMES[cursor.m]} ${cursor.y}</span>
                  <button onClick=${goNextMonth} aria-label="חודש הבא"><${Icon} name="chevronLeft" size=${17} /></button>
                </div>

                <div class="cal-grid">
                  ${WEEKDAYS.map(w => html`<div class="cal-weekday" key=${w}>${w}</div>`)}
                  ${leadingBlanks.map((_, i) => html`<div class="cal-cell blank" key=${'b' + i}></div>`)}
                  ${dayCells.map(d => {
                    const amt = dayTotals[d] || 0;
                    const style = amt > 0 ? `background:rgba(212,175,106,${0.08 + (amt / (maxDayTotal || 1)) * 0.28})` : '';
                    return html`
                      <button
                        key=${d}
                        class=${`cal-cell ${d === todayDay ? 'is-today' : ''} ${d === selectedDay ? 'is-selected-cell' : ''}`}
                        style=${style}
                        onClick=${() => setSelectedDay(d)}
                      >
                        <span class="cal-cell-num">${d}</span>
                        ${amt > 0 ? html`<span class="cal-cell-amt">${formatILS(amt)}</span>` : null}
                      </button>
                    `;
                  })}
                </div>

                <div class="section-label">
                  ${selectedDay ? `סיכום ל־${selectedDay} ב${MONTH_NAMES[cursor.m]}` : 'בחר יום בלוח'}
                </div>
                <div class="stat-row">
                  <${StatCard} label="סה״כ ליום" value=${formatILS(selectedDayTotal)} accent="var(--gold)" currency=${true} />
                  <${StatCard} label="פריטים" value=${selectedDayItemCount} accent="var(--platinum)" />
                </div>

                ${dayProductSummary.length > 0 ? productList(dayProductSummary, maxDayProductQty) : null}

                <div class="section-label">מכירות ביום זה</div>
                ${selectedDaySales.length === 0 ? html`
                  <div class="empty-state">
                    <${Icon} name="packageSearch" size=${30} />
                    <p>אין מכירות ביום זה</p>
                  </div>
                ` : selectedDaySales.map(saleRow)}
              ` : null}

              ${tab === 'summary' ? html`
                <div class="month-nav">
                  <button onClick=${goPrevMonth} aria-label="חודש קודם"><${Icon} name="chevronRight" size=${17} /></button>
                  <span class="month-nav-label">${MONTH_NAMES[cursor.m]} ${cursor.y}</span>
                  <button onClick=${goNextMonth} aria-label="חודש הבא"><${Icon} name="chevronLeft" size=${17} /></button>
                </div>

                <div class="stat-row" style="margin-top:12px">
                  <${StatCard} label="הכנסות החודש" value=${formatILS(monthTotal)} accent="var(--gold)" currency=${true} />
                  <${StatCard} label="פריטים שנמכרו" value=${monthItemCount} accent="var(--platinum)" />
                </div>

                <div class="section-label">הכנסות לפי חודש · ${cursor.y}</div>
                ${yearTotal === 0 ? html`
                  <div class="empty-state">
                    <${Icon} name="barchart" size=${30} />
                    <p>אין עדיין מכירות בשנה הזו</p>
                  </div>
                ` : html`
                  <div class="chart-card">
                    <${MonthBars}
                      monthTotals=${yearMonthTotals}
                      maxTotal=${maxYearMonthTotal}
                      onPick=${(m) => setCursor(c => ({ ...c, m }))}
                      selectedMonth=${cursor.m}
                      currentMonth=${currentMonthIndex}
                    />
                  </div>
                `}

                <div class="section-label">מכירות יומיות</div>
                ${monthSales.length === 0 ? html`
                  <div class="empty-state">
                    <${Icon} name="barchart" size=${30} />
                    <p>אין עדיין מכירות בחודש הזה</p>
                  </div>
                ` : html`
                  <div class="chart-card">
                    <${SignalBars}
                      dayTotals=${dayTotals}
                      daysInMonth=${daysInMonth}
                      maxTotal=${maxDayTotal}
                      onPick=${(d) => { setSelectedDay(d); setTab('log'); }}
                      todayDay=${todayDay}
                      selected=${selectedDay}
                    />
                  </div>
                `}


                <div class="section-label">מוצרים שנמכרו החודש</div>
                ${productSummary.length === 0 ? html`
                  <div class="empty-state">
                    <${Icon} name="packageSearch" size=${30} />
                    <p>אין נתוני מוצרים עדיין</p>
                  </div>
                ` : productList(productSummary, maxProductQty)}
              ` : null}
            </div>
          `}

          <div class="bottom-nav">
            <button class=${`nav-btn ${tab === 'add' ? 'active' : ''}`} onClick=${() => setTab('add')}>
              <${Icon} name="plus" size=${19} /><span>הוספה</span>
            </button>
            <button class=${`nav-btn ${tab === 'log' ? 'active' : ''}`} onClick=${() => setTab('log')}>
              <${Icon} name="calendar" size=${19} /><span>סיכום יומי</span>
            </button>
            <button class=${`nav-btn ${tab === 'summary' ? 'active' : ''}`} onClick=${() => setTab('summary')}>
              <${Icon} name="barchart" size=${19} /><span>סיכום חודשי</span>
            </button>
          </div>
          <div class="home-indicator"></div>

          ${toast ? html`<div class="toast">${toast}</div>` : null}
        </div>
      </div>
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('app'));

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

</script>
</body>
</html>
